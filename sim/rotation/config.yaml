env:
  gui: false
  max_force: 200.0
  max_torque: 50.0
  friction: 0.5
  spinning_friction: 0.5
  rolling_friction: 0.01
  linear_damping: 0.05
  angular_damping: 0.05
  goal_pos: [2.0, 0.0]
  # goal_thresh is computed dynamically at each reset as: goal_thresh_pct * segment_length
  goal_thresh_pct: 0.10
  short_segment_length: 0.3
  spin_penalty_k: 0.1        # kept for reference; new reward uses r_eff_spin directly
  deviation_tolerance: 0.5   # lateral_error threshold for strict early termination
  strict_terminal: false      # set true to require orientation_error < 0.2 at goal
  push_from_edge: true       # set true or use --push-from-edge: edge heading [0.465,0.63,0], force at edge
  goal_reward: 100
  box_mass: 15
  # Domain randomization ranges (sampled uniformly each episode at reset)
  mass_range: [5.0, 15.0]
  friction_range: [0.4, 0.6]

agent:
  lr: 0.0001
  max_action: 1.0
  batch_size: 256
  replay_buffer_max_size: 500000
  gamma: 0.99
  polyak: 0.995
  policy_noise: 0.2
  noise_clip: 0.5
  policy_delay: 2
  n_iter: 2
  exploration_noise: 0.1

training:
  episodes: 3001
  start_timesteps: 2000
  save_freq: 500
  train_segment_mode: "short"
  eval_freq: 25
  eval_wide:
    enabled: false
    mass_range: [10.0, 40.0]
    friction_range: [0.3, 0.7]
